name: Diagnosticar dominio movil

on:
  push:
    branches: [diagnostico-dns-movil]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: DNS publico
        shell: bash
        run: |
          set -x
          for r in 1.1.1.1 8.8.8.8 9.9.9.9; do
            echo "=== RESOLVER $r / www ==="
            dig +short @$r www.suncartravel.com A || true
            dig +short @$r www.suncartravel.com CNAME || true
            echo "=== RESOLVER $r / apex ==="
            dig +short @$r suncartravel.com A || true
          done
      - name: HTTPS y redirecciones
        shell: bash
        run: |
          set -x
          curl -I -L --max-time 30 https://www.suncartravel.com/ || true
          curl -I -L --max-time 30 https://suncartravel.com/ || true
          curl -I -L --max-time 30 https://suncartravel.github.io/ || true
      - name: Certificado TLS
        shell: bash
        run: |
          echo | openssl s_client -connect www.suncartravel.com:443 -servername www.suncartravel.com 2>/tmp/tls.err | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          cat /tmp/tls.err || true
