name: Publicar Suncar Travel

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Actualizar índice MSC público", "Retirar ofertas vencidas (Suncar Travel)"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sitio antes de publicar
        run: python scripts/validate_site.py
      - name: Validar JavaScript compartido
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets -maxdepth 1 -type f -name '*.js' -print0)
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Esperar a que GitHub registre el paquete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          set -euo pipefail
          for intento in {1..15}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fx -- "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::GitHub todavía no devuelve el paquete del sitio para esta ejecución."
          exit 1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
